# Render Blueprint — backend API (set Root Directory to "backend" if not using this file)
services:
  - type: web
    name: bc-tigers-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build:render
    startCommand: npm run start:render
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bc-tigers-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Allowed browser origin(s) for REST + WebSocket CORS (comma-separated).
      - key: CORS_ORIGIN
        value: https://tournament.bctigers.com,https://mastaanrandhawa.github.io
      # Base URL of the deployed frontend — used to build password-reset links.
      - key: APP_URL
        value: https://tournament.bctigers.com
      # SMTP credentials for password-reset email delivery — set in the Render dashboard.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: noreply@bctigers.ca

databases:
  - name: bc-tigers-db
    plan: free
    databaseName: bc_tigers
    user: bc_tigers
