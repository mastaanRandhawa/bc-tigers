name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Prisma client is required for ts-jest to compile files that import @prisma/client.
      - run: npx prisma generate
      # Typecheck shipped code (specs are excluded; their Prisma 7 mock typings
      # are tracked tech debt). Catches production type regressions CI missed.
      - run: npm run typecheck
      - run: npm test
      # Lint is currently non-blocking: the committed code predates the prettier
      # eslint rule, so a green gate needs a dedicated repo-wide formatting PR.
      # Kept here for visibility until that baseline is fixed.
      - run: npm run lint
        continue-on-error: true
